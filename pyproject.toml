[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "hearth"
version = "0.1.0"
description = "Hearth — a local-first personal AI assistant that keeps your data at home (macOS, Windows, Linux)"
requires-python = ">=3.11,<3.13"
dependencies = [
    "PySide6>=6.7,<6.9",
    "qasync>=0.27",
    "httpx>=0.27",
    "pydantic[email]>=2.7",
    "platformdirs>=4.2",
    "keyring>=25.0",
    "send2trash>=1.8",
    "google-auth>=2.29",
    "google-auth-oauthlib>=1.2",
    "google-api-python-client>=2.130",
    "pyobjc-framework-EventKit>=10.2; sys_platform == 'darwin'",
    "pyobjc-framework-Cocoa>=10.2; sys_platform == 'darwin'",
    "psutil>=5.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "pyinstaller>=6.6",
]

[project.scripts]
hearth = "hearth.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
