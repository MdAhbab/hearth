# Hearth configuration.
# Copy to your per-user data directory as config.toml:
#   macOS:   ~/Library/Application Support/Hearth/config.toml
#   Windows: %LOCALAPPDATA%\Hearth\config.toml
#   Linux:   ~/.local/share/Hearth/config.toml
# All values shown are the defaults; omit anything you don't want to override.
# The Settings screen in the app edits this file for you.

[model]
provider = "ollama"
name = "gemma4:e2b"        # switch to "gemma4:e4b" on a 16 GB+ machine
context_length = 4096
max_agent_steps = 6
keep_alive = "5m"          # how long Ollama keeps the model in memory after a request

[ollama]
host = "127.0.0.1"
port = 11434
autostart = true           # start `ollama serve` automatically when needed
startup_timeout_s = 20
request_timeout_s = 120

[gmail]
# Path to the OAuth "Desktop app" credentials JSON you download from
# Google Cloud Console (see docs/google-oauth.md). Tokens are stored in the
# OS credential store (Keychain / Credential Locker / Secret Service),
# never on disk.
credentials_file = ""

[calendar]
# "auto" = native EventKit on macOS, Google Calendar on Windows/Linux.
# Force with "eventkit" or "google".
backend = "auto"

[files]
max_read_bytes = 262144    # 256 KiB cap for file reads shown to the model

[web]
max_fetch_bytes = 500000
fetch_timeout_s = 20.0

[fallback]
# Opt-in cloud fallback: used ONLY when the local model is unreachable, and
# every cloud-answered turn is labeled in the chat. API keys are entered in
# Settings and stored in the OS credential store — never in this file.
# `order` is the priority order; providers without a stored key are skipped.
enabled = false
order = ["gemini", "openai", "deepseek", "nvidia"]
gemini_model = "gemini-2.5-flash"
openai_model = "gpt-4o-mini"
deepseek_model = "deepseek-chat"
nvidia_model = "nvidia/llama-3.1-nemotron-70b-instruct"

[ui]
# "system" follows the OS appearance; or force "dark" / "light".
theme = "system"

# ── Optional capabilities ─────────────────────────────────────────────────────

# Reminders: Permission Center toggle. Native EventKit on macOS, local SQLite
# elsewhere. Weather: Permission Center toggle, free Open-Meteo API (no key).
# Neither needs configuration here.

# External MCP servers (Model Context Protocol). Declare one block per server;
# then enable the "MCP servers" permission in the app. Every MCP tool call
# shows a confirmation card — Hearth cannot verify what external tools do.
#
# [[mcp.servers]]
# name = "filesystem"
# command = "npx"
# args = ["-y", "@modelcontextprotocol/server-filesystem", "/Users/you/Sandbox"]

# Custom /commands (skills): drop markdown files into <data dir>/skills/
#   first line:  # name — description
#   body:        the prompt template ({input} receives text after the command)

# Voice input: needs the optional packages (pip install "hearth[voice]" —
# run.py tries this automatically). The Whisper speech model (~75 MB) is
# downloaded once, only after you agree in the app; transcription always
# runs locally. Model files live in <data dir>/voice-models/.

